spring.application.name=auth-service-poc
server.port=8085

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:antar_auth}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- WebAuthn ---
# Must be "localhost" (no scheme/port) for local browser testing, or a real
# registrable domain in production. Cannot be a bare IP address.
webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
webauthn.rp-name=${WEBAUTHN_RP_NAME:ANTAR Auth (PoC)}
webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:5500}

# --- JWT ---
# Generate with: openssl rand -base64 48
jwt.signing-secret=${JWT_SIGNING_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_BEFORE_ANY_REAL_USE}
jwt.session-ttl-hours=4
jwt.stepup-ttl-seconds=60

logging.level.com.antar.authservice=DEBUG
